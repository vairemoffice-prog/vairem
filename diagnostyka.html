<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Diagnostyka przeglądarki — VAIREM</title>
<meta name="description" content="Strona techniczna: sprawdza, które funkcje działają w Twojej przeglądarce.">
<style>
  body { font: 15px/1.5 -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 24px; background: #eef2f6; color: #2b313a; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { max-width: 640px; }
  pre { background: #fff; border: 1px solid #b8c4cf; padding: 16px; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 Menlo, Consolas, monospace; max-width: 760px; }
  .imgs { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .imgs img { width: 160px; height: auto; border: 1px solid #b8c4cf; background: #dde4ea; }
  #stick-wrap { height: 400px; width: 120px; overflow: visible; position: absolute; left: -9999px; top: 0; }
  #stick { position: sticky; top: 0; height: 20px; background: red; }
  button { font: inherit; padding: 8px 14px; }
</style>
</head>
<body>
<h1>Diagnostyka przeglądarki</h1>
<p>Poczekaj kilka sekund, aż poniższy raport się wypełni. Potem zrób zrzut ekranu całej strony (Cmd+Shift+4 albo Cmd+Shift+5) i wyślij go albo naciśnij „Kopiuj raport” i wklej tekst.</p>
<div class="imgs">
  <img id="i1" src="assets/img/hero-ad-900.webp" alt="Zdjęcie testowe 1">
  <img id="i2" src="assets/img/hero-ad-2-900.webp" alt="Zdjęcie testowe 2">
</div>
<p><button id="copy" type="button">Kopiuj raport</button></p>
<pre id="out">Trwa sprawdzanie…</pre>
<div id="stick-wrap"><div id="stick"></div></div>

<script>
(function () {
  var errors = [];
  window.addEventListener('error', function (e) { errors.push((e.message || 'błąd') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });

  function load(src) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve('ok'); };
      s.onerror = function () { resolve('NIE ZAŁADOWANO'); };
      document.head.appendChild(s);
    });
  }
  function sup(prop, val) { try { return window.CSS && CSS.supports(prop, val) ? 'tak' : 'NIE'; } catch (e) { return 'błąd'; } }
  function webp() {
    try { var c = document.createElement('canvas'); c.width = c.height = 1; return c.toDataURL('image/webp').indexOf('image/webp') === 5 ? 'tak' : 'NIE'; } catch (e) { return 'błąd'; }
  }
  function imgState(id) {
    var i = document.getElementById(id);
    return i.complete && i.naturalWidth > 0 ? 'ok (' + i.naturalWidth + '×' + i.naturalHeight + ')' : 'NIE WCZYTANO';
  }

  Promise.all([
    load('assets/vendor/gsap.min.js'),
    load('assets/vendor/ScrollTrigger.min.js'),
    load('assets/vendor/lenis.min.js')
  ]).then(function (r) {
    var lines = [];
    var m = navigator.userAgent.match(/Version\/([\d.]+)/);
    lines.push('Przeglądarka: ' + navigator.userAgent);
    lines.push('Wersja Safari: ' + (m ? m[1] : 'nie wykryto'));
    lines.push('Okno: ' + innerWidth + '×' + innerHeight + ', DPR ' + devicePixelRatio);
    lines.push('Ogranicz ruch (reduce motion): ' + (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'WŁĄCZONE' : 'wyłączone'));
    lines.push('');
    lines.push('CSS position: sticky: ' + sup('position', 'sticky'));
    lines.push('CSS aspect-ratio: ' + sup('aspect-ratio', '1 / 1'));
    lines.push('CSS min()/svh: ' + sup('width', 'min(100%, calc(100svh * 1.3))'));
    lines.push('CSS translate / scale: ' + sup('translate', '0 0') + ' / ' + sup('scale', '1'));
    lines.push('CSS inset: ' + sup('inset', '0'));
    lines.push('WebP: ' + webp());
    lines.push('IntersectionObserver: ' + ('IntersectionObserver' in window ? 'tak' : 'NIE'));
    lines.push('ResizeObserver: ' + ('ResizeObserver' in window ? 'tak' : 'NIE'));
    lines.push('');
    lines.push('Plik gsap: ' + r[0] + ', typeof gsap = ' + typeof window.gsap);
    lines.push('Plik ScrollTrigger: ' + r[1] + ', typeof ScrollTrigger = ' + typeof window.ScrollTrigger);
    lines.push('Plik lenis: ' + r[2] + ', typeof Lenis = ' + typeof window.Lenis);
    try {
      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        var o = { v: 0 }; gsap.to(o, { v: 1, duration: 0.01 });
        lines.push('GSAP + ScrollTrigger start: ok');
      } else { lines.push('GSAP + ScrollTrigger start: pominięto'); }
    } catch (e) { lines.push('GSAP + ScrollTrigger start: BŁĄD ' + e.message); }
    try {
      if (window.Lenis) { var l = new window.Lenis({ autoRaf: false }); l.destroy(); lines.push('Lenis start: ok'); }
      else { lines.push('Lenis start: pominięto'); }
    } catch (e) { lines.push('Lenis start: BŁĄD ' + e.message); }
    lines.push('');
    lines.push('Zdjęcie 1: ' + imgState('i1'));
    lines.push('Zdjęcie 2: ' + imgState('i2'));

    // real sticky test: the red bar must stay at top 0 after scrolling its container
    var wrap = document.getElementById('stick-wrap');
    var st = document.getElementById('stick');
    wrap.style.position = 'relative'; wrap.style.left = '0';
    wrap.style.height = '2000px';
    var y0 = wrap.getBoundingClientRect().top + window.scrollY;
    window.scrollTo(0, y0 + 300);
    setTimeout(function () {
      var top = Math.round(st.getBoundingClientRect().top);
      lines.push('Test sticky w praktyce: ' + (top === 0 ? 'działa' : 'NIE DZIAŁA (top=' + top + ')'));
      window.scrollTo(0, 0);
      wrap.style.display = 'none';
      lines.push('');
      lines.push('Błędy JS: ' + (errors.length ? errors.join(' | ') : 'brak'));
      document.getElementById('out').textContent = lines.join('\n');
    }, 400);
  });

  document.getElementById('copy').addEventListener('click', function () {
    var t = document.getElementById('out').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { document.getElementById('copy').textContent = 'Skopiowano'; });
  });
})();
</script>
</body>
</html>
