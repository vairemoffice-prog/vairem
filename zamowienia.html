  .ord-sub{ font-size:14px; color:var(--muted); margin:0 0 36px; max-width:56ch; line-height:1.6; }

  .ord-empty{ border:1px dashed var(--border-strong); padding:32px 26px; text-align:center; }
  .ord-empty p{ margin:0 0 18px; font-size:14px; color:var(--muted); line-height:1.6; }

  .ord-list{ display:flex; flex-direction:column; gap:22px; }
  .ord-card{ border:1px solid var(--border); }
  .ord-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;
    padding:18px 22px; border-bottom:1px solid var(--border); background:var(--row-bg);
  }
  .ord-nr{ font-family:'Martian Mono', monospace; font-size:12px; letter-spacing:0.06em; }
  .ord-date{ font-size:11px; color:var(--muted); margin-top:4px; }

  .ord-status{
    font-family:'Martian Mono', monospace; font-size:10px; letter-spacing:0.14em;
    padding:6px 10px; border:1px solid currentColor; white-space:nowrap;
  }
  .ord-status.is-processing{ color:var(--muted); }
  .ord-status.is-shipped{ color:#3E6E9E; }
  .ord-status.is-delivered{ color:var(--green-deep); }

  .ord-items{ padding:6px 22px; }
  .ord-item{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--border-light);
  }
  .ord-item:last-child{ border-bottom:0; }
  .ord-item .name{ font-size:14px; }
  .ord-item .meta{ font-size:11px; color:var(--muted); margin-top:3px; font-family:'Martian Mono', monospace; }
  .ord-item .price{ font-family:'Martian Mono', monospace; font-size:13px; white-space:nowrap; }

  .ord-total{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:16px 22px; border-top:1px solid var(--border); background:var(--row-bg);
  }
  .ord-total .lbl{ font-size:11px; letter-spacing:0.14em; color:var(--muted); font-family:'Martian Mono', monospace; }
  .ord-total .val{ font-size:17px; }

<script>
(function () {
  var PRODUCTS = [
    { nr: '017', name: 'Before It Dries', formula: '[FORMULA]' },
    { nr: '042', name: 'Within', formula: '[FORMULA]' },
    { nr: '086', name: 'Afterlight', formula: '[FORMULA]' }
  ];
  function productByNr(nr) { return PRODUCTS.filter(function (p) { return p.nr === nr; })[0]; }
  function formatPrice(price) { return (!price ? '[CENA]' : price + ' zł'); }

  var ORDERS_KEY = 'vairem-orders';
  var orders = [];
  try {
    var raw = localStorage.getItem(ORDERS_KEY);
    orders = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(orders)) orders = [];
  } catch (e) { orders = []; }

  var listEl = document.getElementById('ord-list');
  var emptyEl = document.getElementById('ord-empty');

  if (orders.length === 0) {
    emptyEl.hidden = false;
    listEl.hidden = true;
    return;
  }

  // No real fulfillment backend behind this static site — the status
  // shown is derived from how long ago the order was placed, matching
  // the "wysyłka 1–3 dni robocze" timeline used at checkout.
  function statusFor(order) {
    var hours = (Date.now() - order.date) / 36e5;
    if (hours < 24) return { cls: 'is-processing', label: 'W REALIZACJI' };
    if (hours < 72) return { cls: 'is-shipped', label: 'WYSŁANO' };
    return { cls: 'is-delivered', label: 'DOSTARCZONO' };
  }

  function formatDate(ts) {
    try {
      return new Date(ts).toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { return ''; }
  }

  listEl.innerHTML = orders.map(function (order) {
    var status = statusFor(order);
    var itemsHtml = (order.items || []).map(function (item) {
      var p = productByNr(item.nr);
      return (
        '<div class="ord-item">' +
          '<div>' +
            '<div class="name">' + (item.name || (p ? p.name : item.nr)) + '</div>' +
            '<div class="meta">' + item.nr + (p ? ' · ' + p.formula : '') + ' · 200 ml × ' + item.qty + '</div>' +
          '</div>' +
          '<div class="price">' + formatPrice(item.price * item.qty) + '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="ord-card">' +
        '<div class="ord-card-head">' +
          '<div>' +
            '<div class="ord-nr">' + order.orderNr + '</div>' +
            '<div class="ord-date">' + formatDate(order.date) + (order.city ? ' · ' + order.city : '') + '</div>' +
          '</div>' +
          '<div class="ord-status ' + status.cls + '">' + status.label + '</div>' +
        '</div>' +
        '<div class="ord-items">' + itemsHtml + '</div>' +
        '<div class="ord-total"><span class="lbl">DO ZAPŁATY</span><span class="val">' + formatPrice(order.total) + '</span></div>' +
      '</div>'
    );
  }).join('');
})();
</script>
