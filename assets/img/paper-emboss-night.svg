<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .mo-fill, .mo-fill-soft, .mo-dot { fill: #2B313A; }
      .mo-stem { fill: none; stroke: #2B313A; stroke-width: 5; stroke-linecap: round; }
    </style>

    <!-- Same material as the page background: only the light/shadow from
         this relief filter reveals the shapes — no separate fill color.
         The full-strength relief is computed first, then crossfaded down
         to a faint trace over the flat, exact-background-color source
         (the last feComposite) so flat/interior areas stay exactly on
         the page's background color and only a whisper of shading
         survives. -->
    <filter id="relief" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#050708" flood-opacity="0.5" result="shadow"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>

      <feDiffuseLighting in="blur" surfaceScale="8" diffuseConstant="1.15" lighting-color="#fff8ec" result="diffuse">
        <feDistantLight azimuth="235" elevation="55"/>
      </feDiffuseLighting>
      <feComposite in="diffuse" in2="SourceAlpha" operator="in" result="diffuseClipped"/>
      <feBlend in="SourceGraphic" in2="diffuseClipped" mode="multiply" result="shaded"/>

      <feSpecularLighting in="blur" surfaceScale="8" specularConstant="0.5" specularExponent="18" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClipped"/>

      <feMerge result="litShape">
        <feMergeNode in="shaded"/>
        <feMergeNode in="specClipped"/>
      </feMerge>

      <feMerge result="fullRelief">
        <feMergeNode in="shadow"/>
        <feMergeNode in="litShape"/>
      </feMerge>

      <feComposite in="fullRelief" in2="SourceGraphic" operator="arithmetic" k1="0" k2="0.18" k3="0.82" k4="0"/>
    </filter>

    <g id="mo-flower">
      <path class="mo-stem" d="M0,24 C-14,70 12,128 -6,176"/>
      <path class="mo-fill-soft" d="M-6,104 C-38,98 -58,120 -62,150 C-32,148 -12,128 -6,104 Z"/>
      <g class="mo-fill">
        <ellipse cx="0" cy="-52" rx="23" ry="52"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(60)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(120)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(180)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(240)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(300)"/>
      </g>
      <g class="mo-fill-soft">
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(30)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(90)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(150)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(210)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(270)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(330)"/>
      </g>
      <circle r="16" class="mo-fill"/>
      <circle cx="-5" cy="-4" r="2.8" class="mo-dot"/>
      <circle cx="6" cy="2" r="2.3" class="mo-dot"/>
      <circle cx="1" cy="-8" r="2" class="mo-dot"/>
      <circle cx="-3" cy="6" r="1.8" class="mo-dot"/>
    </g>

    <g id="mo-bird">
      <path class="mo-fill-soft" d="M-10,10 C-42,27 -74,21 -102,36 C-74,10 -48,4 -18,-3 Z"/>
      <path class="mo-fill-soft" d="M-8,4 C-36,11 -62,-2 -88,4 C-58,-9 -34,-15 -10,-11 Z"/>
      <ellipse cx="6" cy="0" rx="28" ry="14" class="mo-fill"/>
      <circle cx="36" cy="-9" r="12" class="mo-fill"/>
      <path class="mo-fill" d="M47,-11 L63,-6 L47,-2 Z"/>
      <path class="mo-fill" d="M0,-4
               C11,-43 6,-84 -15,-112
               C0,-103 11,-94 17,-81
               C19,-99 28,-112 43,-120
               C36,-101 36,-88 41,-75
               C49,-88 62,-97 77,-99
               C64,-84 58,-71 58,-58
               C43,-43 24,-24 6,-2 Z"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="none"/>

  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(240,190) scale(0.62) rotate(12)"/>
  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(1180,150) scale(0.55) rotate(6)"/>

  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(980,300) scale(1.05) rotate(-12)"/>
  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(1220,760) scale(1.4) rotate(-10)"/>
  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(120,780) scale(0.8) rotate(20)"/>
  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(430,560) scale(0.7) rotate(18)"/>
</svg>
