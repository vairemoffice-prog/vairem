<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .mo-fill { fill: rgba(255,255,255,0.4); }
      .mo-fill-soft { fill: rgba(255,255,255,0.28); }
      .mo-dot { fill: rgba(255,255,255,0.6); }
      .mo-stem { fill: none; stroke: rgba(255,255,255,0.32); stroke-width: 5; stroke-linecap: round; }
    </style>

    <!-- Soft directional bas-relief: blurred alpha as a bump map, lit from
         one distant light, a specular sheen on the raised side and a
         dropped shadow on the recessed side — a genuine carved-relief
         look rather than a flat two-tone silhouette trick. -->
    <filter id="relief" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#141a22" flood-opacity="0.22" result="shadow"/>
      <feMerge result="base">
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="0.85" specularExponent="16" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClipped"/>
      <feMerge>
        <feMergeNode in="base"/>
        <feMergeNode in="specClipped"/>
      </feMerge>
    </filter>

    <g id="mo-flower">
      <path class="mo-stem" d="M0,24 C-14,70 12,128 -6,176"/>
      <path class="mo-fill-soft" d="M-6,104 C-38,98 -58,120 -62,150 C-32,148 -12,128 -6,104 Z"/>
      <g class="mo-fill">
        <ellipse cx="0" cy="-52" rx="23" ry="52"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(60)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(120)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(180)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(240)"/>
        <ellipse cx="0" cy="-52" rx="23" ry="52" transform="rotate(300)"/>
      </g>
      <g class="mo-fill-soft">
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(30)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(90)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(150)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(210)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(270)"/>
        <ellipse cx="0" cy="-30" rx="14" ry="30" transform="rotate(330)"/>
      </g>
      <circle r="16" class="mo-fill"/>
      <circle cx="-5" cy="-4" r="2.8" class="mo-dot"/>
      <circle cx="6" cy="2" r="2.3" class="mo-dot"/>
      <circle cx="1" cy="-8" r="2" class="mo-dot"/>
      <circle cx="-3" cy="6" r="1.8" class="mo-dot"/>
    </g>

    <g id="mo-bird">
      <path class="mo-fill-soft" d="M-10,10 C-42,27 -74,21 -102,36 C-74,10 -48,4 -18,-3 Z"/>
      <path class="mo-fill-soft" d="M-8,4 C-36,11 -62,-2 -88,4 C-58,-9 -34,-15 -10,-11 Z"/>
      <ellipse cx="6" cy="0" rx="28" ry="14" class="mo-fill"/>
      <circle cx="36" cy="-9" r="12" class="mo-fill"/>
      <path class="mo-fill" d="M47,-11 L63,-6 L47,-2 Z"/>
      <path class="mo-fill" d="M0,-4
               C11,-43 6,-84 -15,-112
               C0,-103 11,-94 17,-81
               C19,-99 28,-112 43,-120
               C36,-101 36,-88 41,-75
               C49,-88 62,-97 77,-99
               C64,-84 58,-71 58,-58
               C43,-43 24,-24 6,-2 Z"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="none"/>

  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(240,190) scale(0.62) rotate(12)" opacity="0.75"/>
  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(1180,150) scale(0.55) rotate(6)" opacity="0.7"/>

  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(980,300) scale(1.05) rotate(-12)"/>
  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(1220,760) scale(1.4) rotate(-10)"/>
  <use xlink:href="#mo-flower" href="#mo-flower" filter="url(#relief)" transform="translate(120,780) scale(0.8) rotate(20)" opacity="0.85"/>
  <use xlink:href="#mo-bird" href="#mo-bird" filter="url(#relief)" transform="translate(430,560) scale(0.7) rotate(18)" opacity="0.8"/>
</svg>
